
name: Aktualizace historie Extra Renty

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1,4'

permissions:
  contents: write

concurrency:
  group: aktualizace-renty
  cancel-in-progress: false

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stahnout a overit vysledky
        run: node scripts/update-history.mjs

      - name: Ulozit aktualizovanou historii
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renta.csv
          if ! git diff --cached --quiet; then
            git commit -m "Extra Renta: aktualizace historie losovani"
            git push
          fi
